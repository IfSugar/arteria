# Checks the addon on every pull request and every push. It never publishes anything:
# releases only happen when a version tag is pushed (see release.yml).
name: Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Script and page versions match
        run: |
          sh_ver=$(sed -n 's/^VERSION="\([0-9][0-9.]*\)".*/\1/p' arteria.sh | head -1)
          asp_ver=$(sed -n 's/.*arteria-version: \([0-9][0-9.]*\) .*/\1/p' arteria.asp | head -1)
          echo "arteria.sh: $sh_ver   arteria.asp: $asp_ver"
          if [ -z "$sh_ver" ]; then echo "::error file=arteria.sh::No VERSION=\"x.y.z\" line"; exit 1; fi
          if [ "$sh_ver" != "$asp_ver" ]; then
            echo "::error file=arteria.asp::Page is version '$asp_ver' but the script is '$sh_ver'. The installer needs them to match."
            exit 1
          fi

      - name: Check the script runs on a router shell
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq busybox > /dev/null
          busybox ash -n arteria.sh   # the router's shell
          sh -n arteria.sh            # dash, a strict POSIX shell
          if grep -n 'command -v' arteria.sh; then
            echo "::error file=arteria.sh::Router BusyBox builds can lack 'command'; use have() instead."
            exit 1
          fi

      - name: Check the addon on a stand-in router (sampling, AiMesh node sessions, install and uninstall)
        # Runs the script with only Merlin's BusyBox commands, and [, printf and echo as separate
        # programs (no shell builtins), like the router. The AiMesh node is emulated too.
        run: bash .github/tests/router.sh

      - name: Check the page's JavaScript
        # It must parse, and stay inside its private (function () { ... })(); scope: a global $ or
        # store() replaces the firmware's own and breaks the router's menu.
        run: sh .github/tests/page.sh

      - name: Changelog entry
        run: |
          v=$(sed -n 's/^VERSION="\([0-9][0-9.]*\)".*/\1/p' arteria.sh | head -1)
          if ! grep -q "^## $v\( \|$\)" CHANGELOG.md; then
            echo "::warning file=CHANGELOG.md::No '## $v' section; its release notes would list commit titles instead."
          fi
