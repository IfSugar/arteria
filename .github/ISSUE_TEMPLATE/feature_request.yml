name: ✨ Feature request
description: Suggest a new feature or an improvement for Arteria
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: description
    attributes:
      label: What's your idea?
      description: A clear description of the feature you'd like to see.
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem does it solve?
      description: What are you trying to find out or do, and what makes it hard today?
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Which part?
      options:
        - Map
        - Flow
        - Live readout or busiest devices
        - AiMesh nodes
        - Support for more routers
        - Install, update or amtm
        - Something new
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Anything else?
      description: Mockups, screenshots from other tools, how it could work, alternatives you've considered.

  - type: markdown
    attributes:
      value: |
        ### Want to build it?
        After submitting, comment with how you would build it and wait for a maintainer to agree and assign the issue
        to you before opening a pull request. Some ideas don't fit the project's rules: Arteria only samples while its
        page is open, never changes a router or Wi-Fi setting, writes nothing to flash while it runs, and only uses the
        BusyBox commands Merlin includes
        ([`.github/tests/merlin-applets.txt`](https://github.com/IfSugar/arteria/blob/main/.github/tests/merlin-applets.txt)).

  - type: checkboxes
    id: checklist
    attributes:
      label: Before submitting
      options:
        - label: I've searched the existing issues and this hasn't been requested yet.
          required: true
        - label: If I build this, I'll wait for a maintainer to agree and assign it before opening a pull request.
          required: true
