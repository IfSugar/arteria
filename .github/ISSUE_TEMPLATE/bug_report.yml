name: 🐞 Bug report
description: Something on the Arteria page, in its numbers or on the router doesn't work as it should
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! The more of this form you fill in, the faster it can be fixed:
        most of it is copying and pasting the output of a few commands.

        > [!CAUTION]
        > **Device names, MAC addresses and IP addresses are personal.** The Arteria page shows them: crop or blur
        > them in screenshots. The `check` and `debug` commands this form asks for never print them.
        > Never paste router passwords, SSH keys, your WAN IP address or DDNS name.
        >
        > Found a **security problem**? Please don't open an issue: see the [security policy](https://github.com/IfSugar/arteria/security/policy).

  - type: textarea
    id: description
    attributes:
      label: What went wrong?
      description: A clear description of the bug.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Where?
      options:
        - Map
        - Flow
        - Live readout or busiest devices
        - AiMesh nodes (Not reported, offline, missing devices)
        - Numbers that look wrong
        - Device names
        - The page doesn't load or stays on "Connecting…"
        - Install, update, the menu or amtm
        - Router performance
        - Look and layout
        - Somewhere else
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Traffic Analyzer → Arteria → Flow
        2. Tap a device on the node
        3. See …
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual behavior
      description: What did you expect to happen, and what happened instead? For a number that looks wrong, what did you expect it to be, and why (for example, a speed test running at the time)?
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ## Your router
        Arteria's version is at the bottom of its page (Arteria 1.0.0 · …), or run `arteria.sh version`.
        The firmware version is at the top of every router page.

  - type: input
    id: model
    attributes:
      label: Router model
      placeholder: "RT-AX86U"
    validations:
      required: true

  - type: input
    id: firmware
    attributes:
      label: Firmware version
      placeholder: "3004.388.13_0"
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Arteria version
      placeholder: "1.0.0"
    validations:
      required: true

  - type: input
    id: aimesh
    attributes:
      label: AiMesh nodes
      description: Models, firmware and how they connect. Leave empty if you have none.
      placeholder: "RP-AX56, wireless backhaul"

  - type: input
    id: addons
    attributes:
      label: Other addons
      description: amtm, or scMerlin's Sitemap, lists them. This helps spot clashes over page slots or service events.
      placeholder: "Diversion, Skynet, scMerlin, YazFi"

  - type: input
    id: browser
    attributes:
      label: Browser and computer (problems with the page)
      placeholder: "Chrome 142 on macOS 15.6"

  - type: markdown
    attributes:
      value: |
        ## What the router says
        Run these over SSH. They don't print device names, MAC addresses or IP addresses.

  - type: textarea
    id: debug
    attributes:
      label: Output of `/jffs/addons/arteria/arteria.sh debug`
      description: The router model and firmware, radios, ports, nodes and the driver's counter names.
      render: shell

  - type: textarea
    id: check
    attributes:
      label: Output of `/jffs/addons/arteria/arteria.sh check`
      render: shell

  - type: textarea
    id: syslog
    attributes:
      label: Arteria's lines in the system log
      description: |
        `grep -i arteria /tmp/syslog.log | tail -n 40`. If you use Scribe or syslog-ng, the log is in `/opt/var/log/messages` instead.
      render: shell

  - type: textarea
    id: browser-console
    attributes:
      label: Browser console errors (problems with the page)
      description: Open the browser's developer tools (F12, or ⌥⌘I on macOS) → Console, reload the page and copy the red errors.
      render: text

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Drag and drop images here. Crop or blur device names you'd rather not share.

  - type: textarea
    id: context
    attributes:
      label: Anything else?

  - type: checkboxes
    id: checklist
    attributes:
      label: Before submitting
      options:
        - label: I've searched the existing issues and this hasn't been reported yet.
          required: true
        - label: I'm on the latest version (ran `arteria.sh update`, then reloaded the page with Ctrl+F5 / Cmd+Shift+R).
          required: true
        - label: I removed passwords, keys, my WAN IP and DDNS name, and anything personal from screenshots.
          required: true
